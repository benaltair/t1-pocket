name: MeshCore compatibility
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: t1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      commit: ${{ steps.pin.outputs.commit }}
      build: ${{ steps.pin.outputs.build }}
      update: ${{ steps.pin.outputs.update }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the draft-PR workflow against a local Git repository
        run: python3 tests/proposal.py
      - id: pin
        run: python3 .github/select_release.py

  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [dual, pocket, clock]
        preset: [community, nearby-pacific]
        exclude:
          - profile: clock
            preset: nearby-pacific
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Test and build for the T1
        env:
          TAG: ${{ needs.select.outputs.tag }}
          COMMIT: ${{ needs.select.outputs.commit }}
          PROFILE: ${{ matrix.profile }}
          PRESET: ${{ matrix.preset }}
        run: python update.py --release "$TAG" --expect-commit "$COMMIT" --profile "$PROFILE" --preset "$PRESET" --out builds
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manifest-${{ matrix.profile }}-${{ matrix.preset }}
          path: builds/*/manifest.json
          if-no-files-found: error

  propose:
    needs: [select, build]
    if: >-
      always() && !cancelled() && needs.select.outputs.update == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Open a draft update for review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select.outputs.tag }}
          COMMIT: ${{ needs.select.outputs.commit }}
          RESULT: ${{ needs.build.result }}
          BASE: ${{ github.event.repository.default_branch }}
        run: bash .github/propose.sh
